filters:
  # Supplies the "Terminal" / "Output" label on `bash` and `out` listings, so
  # only a listing with something more specific to say carries a `filename`.
  # See the header of the file for why it builds Quarto's own header bar.
  - code-labels.lua
  - custom-callout

# The extension needs literal hex here (it cannot read Sass), so these two
# colours are duplicated from `_brand.yml`: $brand-mds-green and
# $brand-ubc-blue-deep. `styles.scss` carries the matching note.
custom-callout:
  exercise:
    title: "Exercise"
    icon: true
    icon-symbol: "fa-dumbbell"
    color: "#1c5f2e"
  activity:
    title: "Activity"
    icon: true
    icon-symbol: "fa-person-chalkboard"
    color: "#0055b7"

format:
  html:
    # Colours and fonts come from `_brand.yml`; `styles.scss` layers on top of
    # it for the things brand.yml cannot express (the custom callouts).
    # Precedence is left-to-right, so styles.scss wins over the brand.
    theme:
      light: [brand, styles.scss]
      dark: [brand, styles.scss, styles-dark.scss]
    toc: true
    toc-depth: 3
    toc-expand: 3

editor:
  render-on-save: true
  markdown:
    wrap: sentence
