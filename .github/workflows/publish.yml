name: Build and Publish Quarto Website

on:
  workflow_dispatch:
  push:
    branches: main

env:
  RENV_PATHS_ROOT: ~/.cache/R/renv

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          # keep in sync with the R version recorded in renv.lock;
          # an unpinned R silently drifts and breaks the locked packages
          r-version: '4.6.1'

      - name: Setup renv
        uses: r-lib/actions/setup-renv@v2

      - name: Set up uv
        # setup-uv publishes no floating major tag (no v9/v10); pin the SHA
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # installs the Python pinned in .python-version
          enable-cache: true

      - name: Install Python and Dependencies
        run: |
          uv sync
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Display structure of files
        run: ls -R
